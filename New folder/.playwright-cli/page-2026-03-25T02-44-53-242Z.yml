                        - listitem [ref=e2139]: Do not include personal information such as your name, account number, address, Social Security number, etc. We may ask for some of this information later to help the company identify you and your account.
                    - textbox "What happened? In addition to the information already provided, please describe in detail what happened, and we will send your comments to the companies involved. Include dates, amounts and actions that were taken by you or the company. Do not include personal information such as your name, account number, address, Social Security number, etc. We may ask for some of this information later to help the company identify you and your account." [disabled] [ref=e2140]: This complaint concerns a used 2017 Honda Civic sold and financed through Karplus Auto Sales / Karplus Warehouse, with servicing or collection later involving On Time Financing and Green Road Finance. At the time of sale in July 2020, the contract terms were not meaningfully explained before signing. Optional products were allegedly presented as required, including a tracking device, window etching, and extended warranty. There were also oral statements that no prepayment penalty would apply.
                  - generic [ref=e2143]:
                    - generic [ref=e2144]: What would be a fair resolution?
                    - textbox "What would be a fair resolution?" [disabled] [ref=e2145]: A fair resolution would include a complete payment ledger, itemized explanation of all fees and insurance charges, copies of all signed add-on and tracking disclosures, correction of inaccurate account reporting, review of the repossession charges and damage, and refund or adjustment of any unauthorized or inaccurately disclosed charges.
