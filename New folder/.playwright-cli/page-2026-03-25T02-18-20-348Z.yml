          - generic [ref=e95]:
            - paragraph [ref=e96]: By submitting this complaint, you certify the information provided is true and correct to the best of your knowledge and consent to allow the subject of the complaint and its affiliates to disclose to the Department any information the Department deems relevant to your complaint, including your transactions, accounts, and other experiences with them. If you are submitting this complaint on behalf of another person, you certify under penalty of perjury you are authorized to submit this complaint on that person's behalf.
            - paragraph [ref=e97]: The Department uses consumer complaint information to investigate potential violations of law. In general, consumer complaints are considered to have been received by the Department in confidence. However, Civil Code section 1798.24 allows the Department to disclose your personal information with another person or governmental organization to the extent needed to obtain information for our investigation of a failure to comply with our laws. It also allows the Department to disclose your information with other self-regulatory organizations and government agencies, including federal and state financial services regulators and law enforcement agencies, if certain conditions are met and subject to limitations.
            - paragraph [ref=e98]: "In addition, you may consent to the Department's disclosure of your personal information for reasons other than those set forth in Civil Code section 1798.24 (for example, to allow the Department to forward your personal information to the subject of your complaint when an investigation by the Department is not needed). If you consent to the Department's disclosure of your personal information for these other reasons, please mark the box below:"
            - paragraph [ref=e99]: I consent to the Department's disclosure of my personal information (including my name and financial matters) with the subject of my complaint, with other governmental or quasi-governmental agencies, and with self-regulatory organizations, to the extent the disclosure is needed to help resolve my complaint. This consent is valid for two years from the date my complaint is received by the Department. After those two years have elapsed, the Department will need to obtain a new consent from me to disclose my personal information for reasons other than those set forth in Civil Code section 1798.24
