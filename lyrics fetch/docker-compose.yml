version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: dae
      POSTGRES_PASSWORD: dae
      POSTGRES_DB: dae
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  api:
    build: ./apps/api
    env_file: ./apps/api/.env.example
    depends_on:
      - db
      - redis
    ports:
      - "8000:8000"
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
